name: Build Windows EXE

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pyinstaller PyQt5
      
      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --noconfirm `
            --hidden-import PyQt5.sip `
            --collect-all PyQt5 `
            --name "NCAA05-Team-Browser" `
            ncaa05_gui.py
      
      - name: Build Player Editor EXE (with Helmets tab + helmet pack data)
        run: |
          pyinstaller --onefile --windowed --noconfirm `
            --hidden-import PyQt5.sip `
            --collect-all PyQt5 `
            --hidden-import helmets.helmet_tab `
            --hidden-import helmets.helmet_pack `
            --hidden-import helmets.team_finish `
            --add-data "helmets/pack;helmets/pack" `
            --name "NCAA05-Player-Editor" `
            ncaa05_player_editor.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NCAA05-Team-Browser-Windows
          path: |
            dist/NCAA05-Team-Browser.exe
            dist/NCAA05-Player-Editor.exe
      
      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/NCAA05-Team-Browser.exe
            dist/NCAA05-Player-Editor.exe

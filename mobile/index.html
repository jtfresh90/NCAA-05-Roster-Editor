<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NCAA 2005 Roster Editor</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; padding: 20px; background: #1a1a2e; color: white; }
  h1 { text-align: center; font-size: 22px; margin-bottom: 5px; }
  .subtitle { text-align: center; color: #888; font-size: 13px; margin-bottom: 20px; }
  .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; background: #0f3460; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; box-sizing: border-box; text-align: center; }
  .btn-green { background: #1a7a3a; }
  .btn:active { opacity: 0.8; }
  #fileInput { display: none; }
  .notice { background: #2a2a4a; padding: 15px; border-radius: 8px; margin: 15px 0; font-size: 13px; color: #aaa; line-height: 1.5; }
  #playerList { list-style: none; padding: 0; max-height: 300px; overflow-y: auto; }
  #playerList li { padding: 12px; border-bottom: 1px solid #2a2a4a; font-size: 15px; cursor: pointer; }
  #playerList li.selected { background: #0f3460; }
  #status { text-align: center; color: #888; margin: 10px; font-size: 14px; }
  input[type="text"], input[type="number"], select {
    width: 100%; padding: 10px; border-radius: 6px; border: none;
    background: #1a1a2e; color: white; font-size: 16px; box-sizing: border-box;
  }
  .field-row { display: flex; align-items: center; margin-bottom: 10px; }
  .field-row label { width: 90px; font-size: 14px; color: #aaa; }
  .field-row input, .field-row select { flex: 1; }
  #editorForm { display: none; background: #2a2a4a; padding: 15px; border-radius: 8px; margin-top: 10px; }
</style>
</head>
<body>
<h1>NCAA Football 2005</h1>
<div class="subtitle">Roster Editor v1.3.0</div>

<div class="notice">
  <strong>Load a GCI save or ISO</strong><br>
  <b>GCI:</b> Export roster save from Dolphin, edit, load back.<br>
  <b>ISO:</b> Load NCAA 05 ISO, edit default rosters, download patched ISO.<br><br>
  • PLAY table: 85 fields, 52-byte records<br>
  • Supports rating edits and name changes
</div>

<label for="fileInput" class="btn">Load GCI or ISO File</label>
<input type="file" id="fileInput" accept=".gci,.iso" />

<div id="status"></div>

<div id="playerSection" style="display: none;">
  <div class="notice" id="infoBox"></div>
  <ul id="playerList"></ul>
  
  <div id="editorForm">
    <h3 style="margin-top: 0;">Edit Player</h3>
    <div class="field-row">
      <label>First:</label>
      <input type="text" id="editFirst" maxlength="10">
    </div>
    <div class="field-row">
      <label>Last:</label>
      <input type="text" id="editLast" maxlength="13">
    </div>
    <div class="field-row">
      <label>Position:</label>
      <select id="editPos"></select>
    </div>
    <div id="ratingFields"></div>
    <button class="btn" onclick="applyChanges()">Apply Changes</button>
  </div>
  
  <button class="btn btn-green" id="downloadBtn" onclick="downloadGCI()">Download Modified GCI</button>
</div>

<script>
// === Constants ===
const GCI_DB_OFFSET = 0x880;
const GCI_DB_SIZE = 0x730E0;
const PLAY_SCHEMA_OFFSET = 0xA198;
const PLAY_RECORDS_OFFSET = 0xA708;
const PLAY_RECORD_SIZE = 52;

// 6-bit alphabet
function decodeChar(v) {
  if (v === 0) return '';
  if (v >= 1 && v <= 26) return String.fromCharCode(96 + v);
  if (v >= 27 && v <= 52) return String.fromCharCode(38 + v);
  if (v === 53) return '-';
  if (v === 54) return "'";
  if (v === 55) return '.';
  if (v === 56) return ' ';
  return '?';
}

function encodeChar(c) {
  if (c >= 'a' && c <= 'z') return c.charCodeAt(0) - 96;
  if (c >= 'A' && c <= 'Z') return c.charCodeAt(0) - 38;
  if (c === '-') return 53;
  if (c === "'") return 54;
  if (c === '.') return 55;
  if (c === ' ') return 56;
  return 56; // default to space
}

// Bit operations (MSB-first)
function getBits(data, byteOff, bitOff, n) {
  let v = 0;
  for (let i = 0; i < n; i++) {
    const absBit = bitOff + i;
    const b = data[byteOff + Math.floor(absBit / 8)];
    const bit = (b >> (7 - (absBit % 8))) & 1;
    v = (v << 1) | bit;
  }
  return v;
}

function setBits(data, byteOff, bitOff, n, val) {
  for (let i = 0; i < n; i++) {
    const absBit = bitOff + i;
    const idx = byteOff + Math.floor(absBit / 8);
    const bitPos = 7 - (absBit % 8);
    const bitVal = (val >> (n - 1 - i)) & 1;
    if (bitVal) data[idx] |= (1 << bitPos);
    else data[idx] &= ~(1 << bitPos);
  }
}

// GameCube name -> PC name (reverse)
function gcToPc(gc) { return gc.split('').reverse().join(''); }

// === Global state ===
let gciData = null;      // Full GCI file
let dbData = null;       // Extracted DB (0x730E0 bytes)
let fields = {};         // {pcName: {size, bit}}
let playerCount = 0;
let currentPlayer = -1;

// Rating fields to display/edit
const RATING_FIELDS = [
  ['PTHA', 'Throw Acc'], ['PACC', 'Accuracy'], ['PSPD', 'Speed'],
  ['PAGI', 'Agility'], ['PAWR', 'Awareness'], ['POVR', 'Overall'],
  ['PKAC', 'Kick Acc'], ['PKPW', 'Kick Pow'], ['PTAK', 'Tackle'],
];

const POSITIONS = ['QB','HB','FB','WR','TE','LT','LG','C','RG','RT',
  'LE','RE','DT','LOLB','MLB','ROLB','CB','FS','SS','K','P'];

// === Schema parsing ===
function parseSchema() {
  fields = {};
  let off = PLAY_SCHEMA_OFFSET;
  
  while (off + 16 <= dbData.length) {
    // Check for separator
    if (dbData[off] === 0x21 && dbData[off+1] === 0x00 && dbData[off+2] === 0x04) {
      off += 3;
      continue;
    }
    
    const nameBytes = dbData.slice(off, off+4);
    const name = String.fromCharCode(...nameBytes);
    if (!/^[A-Za-z0-9_]{4}$/.test(name)) break;
    
    const size = (dbData[off+4]<<24)|(dbData[off+5]<<16)|(dbData[off+6]<<8)|dbData[off+7];
    const ftype = (dbData[off+8]<<24)|(dbData[off+9]<<16)|(dbData[off+10]<<8)|dbData[off+11];
    if (size > 5000 || ftype > 20) break;
    
    // Check inline separator
    if (dbData[off+12] === 0x21 && dbData[off+13] === 0x00 && dbData[off+14] === 0x04) {
      off += 15;
      continue;
    }
    
    const bit = (dbData[off+12]<<24)|(dbData[off+13]<<16)|(dbData[off+14]<<8)|dbData[off+15];
    if (bit > 10000) break;
    
    const pc = gcToPc(name);
    fields[pc] = {size, bit};
    off += 16;
    
    if (Object.keys(fields).length > 200) break;
  }
  
  return Object.keys(fields).length;
}

// === Player access ===
function getPlayerRecord(idx) {
  const off = PLAY_RECORDS_OFFSET + idx * PLAY_RECORD_SIZE;
  return off; // offset into dbData
}

function getField(idx, fname) {
  const f = fields[fname];
  if (!f) return 0;
  const recOff = getPlayerRecord(idx);
  return getBits(dbData, recOff, f.bit, f.size);
}

function setField(idx, fname, val) {
  const f = fields[fname];
  if (!f) return;
  const recOff = getPlayerRecord(idx);
  setBits(dbData, recOff, f.bit, f.size, val);
}

function getPlayerName(idx) {
  let first = '', last = '';
  for (let i = 1; i <= 10; i++) {
    const fname = 'PF' + String(i).padStart(2, '0');
    const f = fields[fname];
    if (!f) continue;
    const v = getBits(dbData, getPlayerRecord(idx), f.bit, f.size);
    if (v === 0) break;
    first += decodeChar(v);
  }
  for (let i = 1; i <= 13; i++) {
    const fname = 'PL' + String(i).padStart(2, '0');
    const f = fields[fname];
    if (!f) continue;
    const v = getBits(dbData, getPlayerRecord(idx), f.bit, f.size);
    if (v === 0) break;
    last += decodeChar(v);
  }
  return [first, last];
}

function setPlayerName(idx, first, last) {
  const recOff = getPlayerRecord(idx);
  // First name: PF01-PF10
  for (let i = 1; i <= 10; i++) {
    const fname = 'PF' + String(i).padStart(2, '0');
    const f = fields[fname];
    if (!f) continue;
    const c = i <= first.length ? first[i-1] : '';
    const v = c ? encodeChar(c) : 0;
    setBits(dbData, recOff, f.bit, f.size, v);
  }
  // Last name: PL01-PL13
  for (let i = 1; i <= 13; i++) {
    const fname = 'PL' + String(i).padStart(2, '0');
    const f = fields[fname];
    if (!f) continue;
    const c = i <= last.length ? last[i-1] : '';
    const v = c ? encodeChar(c) : 0;
    setBits(dbData, recOff, f.bit, f.size, v);
  }
}

// === UI ===
document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  
  const status = document.getElementById('status');
  const fileName = file.name.toLowerCase();
  const isIso = fileName.endsWith('.iso');
  
  status.textContent = isIso ? 'Loading ISO (slicing LEAGUE.DAT)...' : 'Loading GCI...';
  
  try {
    if (isIso) {
      // ISO: extract LEAGUE.DAT via slice (2MB at 0x4E352D78)
      const LEAGUE_OFF = 0x4E352D78;
      const LEAGUE_SIZE = 2176504;
      const blob = file.slice(LEAGUE_OFF, LEAGUE_OFF + LEAGUE_SIZE);
      const buffer = await blob.arrayBuffer();
      const leagueData = new Uint8Array(buffer);
      
      // Store ISO file reference for rebuilding
      window.isoFile = file;
      window.leagueData = leagueData;
      
      // Parse YALP sections (find all, use first schema)
      status.textContent = 'Parsing 421 YALP sections...';
      await parseIsoLeague(leagueData);
      
      status.textContent = `Loaded ISO: ${isoPlayerCount} players across ${isoSections.length} teams`;
      document.getElementById('infoBox').innerHTML = 
        `<strong>ISO loaded:</strong> ${file.name}<br>` +
        `LEAGUE.DAT: ${isoSections.length} YALP sections, ${isoPlayerCount} players<br>` +
        `Tap a player to edit. Download creates patched ISO.`;
      
      populateIsoPlayerList();
      
    } else {
      // GCI: existing logic
      const buffer = await file.arrayBuffer();
      gciData = new Uint8Array(buffer);
      
      // Find DB marker
      let dbOff = -1;
      for (let i = 0; i < gciData.length - 2; i++) {
        if (gciData[i] === 0x44 && gciData[i+1] === 0x42) { // 'DB'
          dbOff = i;
          break;
        }
      }
      if (dbOff < 0) throw new Error('No DB found in GCI');
      
      // Extract DB
      dbData = gciData.slice(dbOff, dbOff + GCI_DB_SIZE);
      
      // Parse schema
      const fieldCount = parseSchema();
      if (fieldCount === 0) throw new Error('Failed to parse PLAY schema');
      
      // Estimate player count
      playerCount = 0;
      for (let i = 0; i < 2000; i++) {
        const off = PLAY_RECORDS_OFFSET + i * PLAY_RECORD_SIZE;
        if (off + PLAY_RECORD_SIZE > dbData.length) break;
        playerCount++;
      }
      
      status.textContent = `Loaded: ${fieldCount} fields, ${playerCount} players`;
      document.getElementById('infoBox').innerHTML = 
        `<strong>GCI loaded:</strong> ${file.name}<br>` +
        `PLAY table: ${fieldCount} fields, ${playerCount} records<br>` +
        `Tap a player to edit.`;
      
      populateGciPlayerList();
    }
    
    document.getElementById('playerSection').style.display = 'block';
    setupEditorUI();
    
  } catch (err) {
    status.textContent = 'Error: ' + err.message;
    console.error(err);
  }
});

// === ISO LEAGUE.DAT support ===
let isoSections = [];  // Array of {offset, fields, recordsOffset}
let isoPlayerCount = 0;
let isoPlayerIndex = [];  // Maps global idx -> {sectionIdx, localIdx}

async function parseIsoLeague(leagueData) {
  isoSections = [];
  isoPlayerIndex = [];
  
  // Find all YALP sections
  let pos = 0;
  while (true) {
    const idx = findBytes(leagueData, [0x59, 0x41, 0x4C, 0x50], pos); // 'YALP'
    if (idx < 0) break;
    
    // Skip if too close to previous (false positive)
    if (isoSections.length > 0 && idx - isoSections[isoSections.length-1].offset < 0x1000) {
      pos = idx + 1;
      continue;
    }
    
    // Find schema (01FP within 0x2000 bytes)
    let schemaOff = -1;
    for (let i = idx; i < Math.min(idx + 0x2000, leagueData.length - 4); i++) {
      if (leagueData[i] === 0x30 && leagueData[i+1] === 0x31 && 
          leagueData[i+2] === 0x46 && leagueData[i+3] === 0x50) { // '01FP'
        schemaOff = i;
        break;
      }
    }
    
    if (schemaOff > 0) {
      // Parse schema (reuse parseSchema logic but with offset)
      const savedDb = dbData;
      dbData = leagueData; // Temporarily set for parseSchema
      const savedOff = PLAY_SCHEMA_OFFSET;
      // We need a version that takes offset - for now, just count fields
      let fieldCount = 0;
      let off = schemaOff;
      while (off + 16 <= leagueData.length && fieldCount < 100) {
        if (leagueData[off] === 0x21 && leagueData[off+1] === 0x00) { off += 3; continue; }
        const name = String.fromCharCode(leagueData[off], leagueData[off+1], leagueData[off+2], leagueData[off+3]);
        if (!/^[A-Za-z0-9_]{4}$/.test(name)) break;
        const size = (leagueData[off+4]<<24)|(leagueData[off+5]<<16)|(leagueData[off+6]<<8)|leagueData[off+7];
        if (size > 5000) break;
        off += 16;
        fieldCount++;
        if (off - schemaOff > 2000) break;
      }
      dbData = savedDb;
      
      if (fieldCount >= 80 && fieldCount <= 90) {
        // Find records offset (after schema)
        const recordsOff = off;
        isoSections.push({
          offset: idx,
          schemaOffset: schemaOff,
          recordsOffset: recordsOff,
          fieldCount: fieldCount
        });
      }
    }
    
    pos = idx + 1;
    if (isoSections.length >= 500) break;
    
    // Yield to UI occasionally
    if (isoSections.length % 50 === 0) {
      await new Promise(r => setTimeout(r, 0));
    }
  }
  
  // Build player index (assume 50 players per section max for UI)
  isoPlayerCount = 0;
  for (let si = 0; si < isoSections.length; si++) {
    const sec = isoSections[si];
    // Estimate: section size / 52 bytes per record, cap at 80
    const nextOff = (si + 1 < isoSections.length) ? isoSections[si+1].offset : leagueData.length;
    const avail = nextOff - sec.recordsOffset;
    const count = Math.min(Math.floor(avail / 52), 80);
    for (let li = 0; li < count; li++) {
      isoPlayerIndex.push({sectionIdx: si, localIdx: li});
    }
  }
  isoPlayerCount = isoPlayerIndex.length;
  
  // Parse schema from first section for field definitions
  if (isoSections.length > 0) {
    const sec = isoSections[0];
    const savedDb = dbData;
    dbData = leagueData;
    // Temporarily override PLAY_SCHEMA_OFFSET
    const origOff = PLAY_SCHEMA_OFFSET;
    // Hack: parseSchema uses PLAY_SCHEMA_OFFSET, so we monkey-patch
    // For now, just manually parse into fields
    fields = {};
    let off = sec.schemaOffset;
    while (off + 16 <= leagueData.length) {
      if (leagueData[off] === 0x21 && leagueData[off+1] === 0x00) { off += 3; continue; }
      const nameBytes = [leagueData[off], leagueData[off+1], leagueData[off+2], leagueData[off+3]];
      const name = String.fromCharCode(...nameBytes);
      if (!/^[A-Za-z0-9_]{4}$/.test(name)) break;
      const size = (leagueData[off+4]<<24)|(leagueData[off+5]<<16)|(leagueData[off+6]<<8)|leagueData[off+7];
      const ftype = (leagueData[off+8]<<24)|(leagueData[off+9]<<16)|(leagueData[off+10]<<8)|leagueData[off+11];
      if (size > 5000 || ftype > 20) break;
      if (leagueData[off+12] === 0x21) { off += 15; continue; }
      const bit = (leagueData[off+12]<<24)|(leagueData[off+13]<<16)|(leagueData[off+14]<<8)|leagueData[off+15];
      if (bit > 10000) break;
      fields[gcToPc(name)] = {size, bit};
      off += 16;
      if (Object.keys(fields).length > 200) break;
    }
    dbData = savedDb;
  }
}

function findBytes(data, pattern, start) {
  for (let i = start; i <= data.length - pattern.length; i++) {
    let match = true;
    for (let j = 0; j < pattern.length; j++) {
      if (data[i+j] !== pattern[j]) { match = false; break; }
    }
    if (match) return i;
  }
  return -1;
}

function getIsoField(globalIdx, fname) {
  const {sectionIdx, localIdx} = isoPlayerIndex[globalIdx];
  const sec = isoSections[sectionIdx];
  const f = fields[fname];
  if (!f) return 0;
  const recOff = sec.recordsOffset + localIdx * 52;
  return getBits(window.leagueData, recOff, f.bit, f.size);
}

function setIsoField(globalIdx, fname, val) {
  const {sectionIdx, localIdx} = isoPlayerIndex[globalIdx];
  const sec = isoSections[sectionIdx];
  const f = fields[fname];
  if (!f) return;
  const recOff = sec.recordsOffset + localIdx * 52;
  setBits(window.leagueData, recOff, f.bit, f.size, val);
}

function populateIsoPlayerList() {
  const list = document.getElementById('playerList');
  list.innerHTML = '';
  const showCount = Math.min(isoPlayerCount, 100);
  for (let i = 0; i < showCount; i++) {
    const ppos = getIsoField(i, 'PPOS');
    const posName = POSITIONS[ppos] || `P${ppos}`;
    const ovr = getIsoField(i, 'POVR');
    const li = document.createElement('li');
    li.textContent = `Player ${i} (${posName}) OVR:${ovr}`;
    li.onclick = () => selectIsoPlayer(i);
    list.appendChild(li);
  }
  if (isoPlayerCount > 100) {
    const li = document.createElement('li');
    li.textContent = `... and ${isoPlayerCount - 100} more`;
    li.style.color = '#888';
    list.appendChild(li);
  }
}

function populateGciPlayerList() {
  const list = document.getElementById('playerList');
  list.innerHTML = '';
  const showCount = Math.min(playerCount, 100);
  for (let i = 0; i < showCount; i++) {
    const [first, last] = getPlayerName(i);
    const name = (first + ' ' + last).trim() || `Player ${i}`;
    const ppos = getField(i, 'PPOS');
    const posName = POSITIONS[ppos] || `P${ppos}`;
    const ovr = getField(i, 'POVR');
    const li = document.createElement('li');
    li.textContent = `${name} (${posName}) OVR:${ovr}`;
    li.onclick = () => selectPlayer(i);
    list.appendChild(li);
  }
}

function setupEditorUI() {
  const posSel = document.getElementById('editPos');
  posSel.innerHTML = '';
  POSITIONS.forEach((p, idx) => {
    const opt = document.createElement('option');
    opt.value = idx;
    opt.textContent = p;
    posSel.appendChild(opt);
  });
  const rfDiv = document.getElementById('ratingFields');
  rfDiv.innerHTML = '';
  RATING_FIELDS.forEach(([fname, label]) => {
    if (!fields[fname]) return;
    const div = document.createElement('div');
    div.className = 'field-row';
    div.innerHTML = `<label>${label}:</label><input type="number" id="edit_${fname}" min="0" max="31">`;
    rfDiv.appendChild(div);
  });
}

function selectIsoPlayer(idx) {
  currentPlayer = idx;
  window.isIsoMode = true;
  const items = document.getElementById('playerList').children;
  for (let i = 0; i < items.length; i++) {
    items[i].classList.toggle('selected', i === idx);
  }
  document.getElementById('editFirst').value = '';
  document.getElementById('editLast').value = '';
  document.getElementById('editPos').value = getIsoField(idx, 'PPOS');
  RATING_FIELDS.forEach(([fname, label]) => {
    const el = document.getElementById('edit_' + fname);
    if (el) el.value = getIsoField(idx, fname);
  });
  document.getElementById('editorForm').style.display = 'block';
}
      li.textContent = `... and ${playerCount - 100} more (showing first 100)`;
      li.style.color = '#888';
      list.appendChild(li);
    }
    
    document.getElementById('playerSection').style.display = 'block';
    
    // Setup position dropdown
    const posSel = document.getElementById('editPos');
    posSel.innerHTML = '';
    POSITIONS.forEach((p, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = p;
      posSel.appendChild(opt);
    });
    
    // Setup rating fields
    const rfDiv = document.getElementById('ratingFields');
    rfDiv.innerHTML = '';
    RATING_FIELDS.forEach(([fname, label]) => {
      if (!fields[fname]) return;
      const div = document.createElement('div');
      div.className = 'field-row';
      div.innerHTML = `<label>${label}:</label><input type="number" id="edit_${fname}" min="0" max="31">`;
      rfDiv.appendChild(div);
    });
    
  } catch (err) {
    status.textContent = 'Error: ' + err.message;
    console.error(err);
  }
});

function selectPlayer(idx) {
  currentPlayer = idx;
  
  // Highlight
  const items = document.getElementById('playerList').children;
  for (let i = 0; i < items.length; i++) {
    items[i].classList.toggle('selected', i === idx);
  }
  
  // Load into form
  const [first, last] = getPlayerName(idx);
  document.getElementById('editFirst').value = first;
  document.getElementById('editLast').value = last;
  document.getElementById('editPos').value = getField(idx, 'PPOS');
  
  RATING_FIELDS.forEach(([fname, label]) => {
    const el = document.getElementById('edit_' + fname);
    if (el) el.value = getField(idx, fname);
  });
  
  document.getElementById('editorForm').style.display = 'block';
}

function applyChanges() {
  if (currentPlayer < 0) return;
  
  const isIso = window.isIsoMode === true;
  
  if (isIso) {
    // ISO mode: use iso field setters
    const pos = parseInt(document.getElementById('editPos').value);
    setIsoField(currentPlayer, 'PPOS', pos);
    
    RATING_FIELDS.forEach(([fname, label]) => {
      const el = document.getElementById('edit_' + fname);
      if (el && el.value !== '') {
        setIsoField(currentPlayer, fname, parseInt(el.value));
      }
    });
    
    // Refresh list item
    const posName = POSITIONS[pos] || `P${pos}`;
    const ovr = getIsoField(currentPlayer, 'POVR');
    const li = document.getElementById('playerList').children[currentPlayer];
    if (li) li.textContent = `Player ${currentPlayer} (${posName}) OVR:${ovr}`;
  } else {
    // GCI mode
    const first = document.getElementById('editFirst').value;
    const last = document.getElementById('editLast').value;
    setPlayerName(currentPlayer, first, last);
    
    const pos = parseInt(document.getElementById('editPos').value);
    setField(currentPlayer, 'PPOS', pos);
    
    RATING_FIELDS.forEach(([fname, label]) => {
      const el = document.getElementById('edit_' + fname);
      if (el && el.value !== '') {
        setField(currentPlayer, fname, parseInt(el.value));
      }
    });
    
    // Refresh list item
    const [nf, nl] = getPlayerName(currentPlayer);
    const name = (nf + ' ' + nl).trim() || `Player ${currentPlayer}`;
    const posName = POSITIONS[pos] || `P${pos}`;
    const ovr = getField(currentPlayer, 'POVR');
    const li = document.getElementById('playerList').children[currentPlayer];
    if (li) li.textContent = `${name} (${posName}) OVR:${ovr}`;
  }
  
  document.getElementById('status').textContent = 'Changes applied (in memory). Download to save.';
}

function downloadGCI() {
  const isIso = window.isIsoMode === true;
  
  if (isIso) {
    // ISO mode: rebuild ISO with patched LEAGUE.DAT via Blob
    if (!window.isoFile || !window.leagueData) return;
    
    const LEAGUE_OFF = 0x4E352D78;
    const LEAGUE_SIZE = 2176504;
    const isoFile = window.isoFile;
    
    status.textContent = 'Rebuilding ISO (this may take a moment)...';
    
    // Create new ISO: [0..LEAGUE_OFF) + modified LEAGUE.DAT + [LEAGUE_OFF+SIZE..end)
    const part1 = isoFile.slice(0, LEAGUE_OFF);
    const part2 = new Blob([window.leagueData]);
    const part3 = isoFile.slice(LEAGUE_OFF + LEAGUE_SIZE);
    
    const newIso = new Blob([part1, part2, part3], {type: 'application/octet-stream'});
    
    const url = URL.createObjectURL(newIso);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'ncaa05_patched.iso';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    
    document.getElementById('status').textContent = 'Patched ISO downloaded!';
    return;
  }
  
  // GCI mode
  if (!gciData || !dbData) return;
  
  // Write DB back into GCI
  let dbOff = -1;
  for (let i = 0; i < gciData.length - 2; i++) {
    if (gciData[i] === 0x44 && gciData[i+1] === 0x42) {
      dbOff = i;
      break;
    }
  }
  if (dbOff >= 0) {
    gciData.set(dbData, dbOff);
  }
  
  // Download
  const blob = new Blob([gciData], {type: 'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ncaa05_modified.gci';
  a.click();
  URL.revokeObjectURL(url);
  
  document.getElementById('status').textContent = 'GCI downloaded! Load it in Dolphin.';
}
</script>
